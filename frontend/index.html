<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ReconOne — Marketplace Reconciliation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545;--navy-3:#1B4079;--cobalt:#1E5EFF;--cobalt-soft:#e7eeff;--teal:#0FA3A3;--teal-soft:#e4f6f5;
  --ink:#101827;--slate:#5b6b82;--line:#e6eaf1;--line-2:#eef1f6;--paper:#f6f8fc;--white:#fff;
  --green:#159a63;--green-soft:#e5f6ee;--amber:#c47f04;--amber-soft:#fbf1da;--red:#cc3340;--red-soft:#fbe7e8;
  --purple:#7b61ff;--purple-soft:#efeaff;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 8px 24px rgba(11,37,69,.05);--shadow-lg:0 12px 40px rgba(11,37,69,.14);--r:14px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:linear-gradient(178deg,var(--navy) 0%,#081a34 100%);color:#cfe0f6;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)}
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{width:38px;height:38px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--cobalt),var(--teal));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(30,94,255,.4)}
.brand h1{font-size:16px;color:#fff;margin:0;font-weight:700;letter-spacing:-.2px}
.brand span{font-size:11px;color:#7f9cc8;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.nav{padding:12px 12px;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#5f7bab;font-weight:700;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;margin:2px 0;border:0;background:transparent;color:#c3d5f0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;position:relative;transition:background .16s,color .16s}
.nav-item .ico{width:18px;height:18px;flex:none;opacity:.85}
.nav-item .badge{margin-left:auto;font-size:10px;font-weight:700;background:rgba(204,51,64,.9);color:#fff;border-radius:20px;padding:2px 7px;min-width:20px;text-align:center}
.nav-item .badge.g{background:rgba(21,154,99,.9)}.nav-item .badge.a{background:rgba(196,127,4,.95)}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(30,94,255,.22),rgba(30,94,255,.05));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--teal)}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f9cc8}
.sidebar-foot .run{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#bcd}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(15,163,163,.25)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,248,252,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .titles h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.topbar .titles p{margin:2px 0 0;font-size:12.5px;color:var(--slate)}
.spacer{flex:1}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--slate);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{border-color:var(--cobalt);color:var(--cobalt)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .swatch{width:8px;height:8px;border-radius:2px}
.pill{font-size:12px;font-weight:600;padding:7px 14px;border-radius:10px;background:var(--white);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:8px}
.content{padding:26px 30px 60px;max-width:1440px}
.page{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec{margin:30px 0 14px;display:flex;align-items:center;gap:12px}
.sec:first-child{margin-top:4px}
.sec .k{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cobalt);background:var(--cobalt-soft);padding:4px 9px;border-radius:6px}
.sec h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.sec .rule{flex:1;height:1px;background:var(--line)}

.kpis{display:grid;gap:14px}
.kpis.c5{grid-template-columns:repeat(5,1fr)}.kpis.c4{grid-template-columns:repeat(4,1fr)}.kpis.c3{grid-template-columns:repeat(3,1fr)}
.kcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kcard .lab{font-size:12px;color:var(--slate);font-weight:600;display:flex;align-items:center;gap:7px}
.kcard .val{font-size:24px;font-weight:800;letter-spacing:-.8px;margin-top:9px;line-height:1}
.kcard .sub{font-size:11.5px;margin-top:8px;color:var(--slate);display:flex;align-items:center;gap:6px}
.kcard .accent{position:absolute;left:0;top:0;bottom:0;width:4px}
.kcard.good .accent{background:var(--green)}.kcard.warn .accent{background:var(--amber)}.kcard.bad .accent{background:var(--red)}.kcard.info .accent{background:var(--cobalt)}.kcard.tealc .accent{background:var(--teal)}.kcard.purp .accent{background:var(--purple)}
.trend{font-weight:700;padding:2px 6px;border-radius:5px;font-size:11px}
.trend.up{color:var(--green);background:var(--green-soft)}.trend.down{color:var(--red);background:var(--red-soft)}

.grid{display:grid;gap:16px}
.grid.g2{grid-template-columns:1fr 1fr}.grid.g23{grid-template-columns:1.2fr .8fr}.grid.g32{grid-template-columns:.85fr 1.15fr}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel .ph{padding:15px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.panel .ph h4{margin:0;font-size:13.5px;font-weight:700}
.panel .ph .hint{margin-left:auto;font-size:11.5px;color:var(--slate)}
.panel .pb{padding:16px 18px}
.chart-wrap{position:relative;height:260px}.chart-wrap.sm{height:200px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--slate);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f9fbff}
tr.clickable{cursor:pointer}
td.r,th.r{text-align:right}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.t-open{background:var(--red-soft);color:var(--red)}.t-prog{background:var(--amber-soft);color:var(--amber)}.t-closed{background:var(--green-soft);color:var(--green)}.t-review{background:var(--cobalt-soft);color:var(--cobalt)}.t-purple{background:var(--purple-soft);color:var(--purple)}
.neg{color:var(--red);font-weight:600}.pos{color:var(--green);font-weight:600}
.mkt{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.mkt .swatch{width:8px;height:8px;border-radius:2px}

/* bulk bar + checkboxes */
.bulkbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fbfcfe;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--slate);flex-wrap:wrap}
.bulkbar .selinfo{font-weight:600;color:var(--ink)}
.btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--cobalt);color:var(--cobalt)}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff}.btn.pri:hover{background:#1a52e0;color:#fff}
.btn.sm{padding:4px 9px;font-size:11px}
.ck{width:15px;height:15px;accent-color:var(--cobalt);cursor:pointer}

/* hero */
.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-3) 60%,#1f4f96 100%);border-radius:18px;padding:26px 28px;color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;margin-bottom:22px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(15,163,163,.35),transparent 65%)}
.hero .eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8fb2e8;font-weight:700}
.hero .lead{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;position:relative}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero .big small{font-size:16px;font-weight:600;opacity:.7;margin-left:4px}
.hero .leak-lab{font-size:13px;color:#c7d8f2;margin-top:6px;max-width:340px}
.hero .stat{border-left:1px solid rgba(255,255,255,.18);padding-left:22px}
.hero .stat .n{font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero .stat .l{font-size:11.5px;color:#a9c3ea;margin-top:2px}

.modgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.modcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.18s;text-align:left;display:flex;flex-direction:column;gap:10px}
.modcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--cobalt)}
.modcard .top{display:flex;align-items:center;justify-content:space-between}
.modcard .mi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.modcard .health{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.modcard .name{font-size:13px;font-weight:700;line-height:1.3}
.modcard .metric{font-size:20px;font-weight:800;letter-spacing:-.5px}
.modcard .mlab{font-size:11px;color:var(--slate)}
.bar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.funnel{display:flex;flex-direction:column;gap:7px}
.fstep{display:flex;align-items:center;gap:14px}
.fstep .fbar{height:38px;border-radius:8px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:13px;min-width:90px}
.fstep .fmeta{font-size:12px;color:var(--slate)}.fstep .fmeta b{color:var(--ink);font-size:13px}
.fstep .drop{font-size:11px;color:var(--red);font-weight:600}

.journey{display:flex;gap:0;overflow-x:auto;padding:6px 2px}
.jstep{flex:1;min-width:104px;text-align:center;position:relative;padding:0 4px}
.jstep .jc{width:30px;height:30px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;position:relative;z-index:2}
.jstep .jl{font-size:10.5px;font-weight:600;color:var(--ink);line-height:1.25}
.jstep .jn{font-size:11px;color:var(--slate);margin-top:3px;font-weight:700}
.jstep::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1}
.jstep:first-child::before{display:none}.jstep.done::before{background:var(--teal)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--slate);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.recon-flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.rf-node{flex:1;min-width:120px;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.rf-node .rn{font-size:11px;color:var(--slate);font-weight:600}.rf-node .rv{font-size:17px;font-weight:800;margin-top:4px}
.rf-arrow{display:grid;place-items:center;padding:0 8px;color:var(--slate);font-size:18px}

/* Kanban board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;overflow-x:auto}
.bcol{background:#f4f7fc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:180px}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-size:12px;font-weight:700}
.bcol .bh .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--slate)}
.claim{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(11,37,69,.04)}
.claim:hover{border-color:var(--cobalt);box-shadow:var(--shadow)}
.claim .cid{font-size:11px;font-weight:700;color:var(--ink)}
.claim .camt{font-size:15px;font-weight:800;margin:5px 0;letter-spacing:-.3px}
.claim .cmeta{font-size:10.5px;color:var(--slate);display:flex;align-items:center;justify-content:space-between}
.claim .cbar{height:3px;border-radius:3px;margin-top:8px;background:var(--line-2);overflow:hidden}

/* confidence meter */
.conf{display:flex;align-items:center;gap:8px}
.conf .mtr{width:56px;height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}
.conf .mtr i{display:block;height:100%;border-radius:4px}
.conf b{font-size:11.5px;font-weight:700}

/* alert rows */
.alert{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)}
.alert .sev{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.alert .amsg{flex:1}.alert .amsg .at{font-size:13px;font-weight:700}.alert .amsg .ad{font-size:11.5px;color:var(--slate);margin-top:2px}
.alert .atime{font-size:11px;color:var(--slate);white-space:nowrap}
.sev.hi{background:var(--red-soft)}.sev.md{background:var(--amber-soft)}.sev.lo{background:var(--cobalt-soft)}

.note{background:var(--teal-soft);border:1px solid #bfe9e7;border-radius:12px;padding:14px 16px;font-size:12.5px;color:#0a5f5e;display:flex;gap:10px;margin-top:16px}
.note b{color:#084848}
.freshbadge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}

/* drawer */
.scrim{display:none;position:fixed;inset:0;background:rgba(11,37,69,.4);z-index:40}
.scrim.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:92vw;background:#fff;z-index:60;box-shadow:-20px 0 50px rgba(11,37,69,.25);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer .dh .dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--cobalt)}
.drawer .dh h3{margin:4px 0 0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.drawer .dh .x{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--slate);flex:none}
.drawer .db{padding:20px 22px;overflow-y:auto;flex:1}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.kv .kk{color:var(--slate)}.kv .vv{font-weight:600;text-align:right}
.dsec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--slate);margin:20px 0 10px}
.tl{position:relative;padding-left:22px}
.tl .ti{position:relative;padding-bottom:16px;font-size:12px}
.tl .ti::before{content:"";position:absolute;left:-16px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.tl .ti::after{content:"";position:absolute;left:-12px;top:12px;bottom:0;width:1px;background:var(--line)}
.tl .ti:last-child::after{display:none}
.tl .ti .tt{font-weight:700}.tl .ti .td{color:var(--slate);font-size:11px}
.dactions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 22px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){.kpis.c5,.kpis.c4{grid-template-columns:repeat(2,1fr)}.modgrid{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(3,1fr)}.grid.g2,.grid.g23,.grid.g32{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;z-index:70;width:264px}.sidebar.open{transform:none}.hamburger{display:grid!important}.modgrid{grid-template-columns:repeat(2,1fr)}.kpis.c3,.kpis.c4,.kpis.c5{grid-template-columns:1fr 1fr}.content{padding:18px}.board{grid-template-columns:1fr}}
.hamburger{display:none;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}

/* ===== Sales vs Settlement (live module) ===== */
.kcard.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.kcard.clickable:hover{transform:translateY(-2px);border-color:var(--cobalt)}
.kcard.clickable:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.kcard.clickable.on{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt) inset,var(--shadow)}
.kcard.clickable .lab::after{content:'▾';margin-left:auto;opacity:.45;font-size:12px}
.kcard.clickable.on .lab::after{content:'▴';opacity:.8}
.svs-chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;max-width:100%}
.svs-chips .chip{flex:none;white-space:nowrap}
.svs-chips .chip b{font-weight:700}
.svs-chips .chip.on b{color:#fff}
.svs-fbar{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.svs-fbar .svs-frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.svs-kvp{margin-top:14px;border-color:var(--cobalt);animation:svsKvIn .18s ease-out}
@keyframes svsKvIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.svs-kvp .ph{display:flex;align-items:center;gap:10px}
.svs-kvp .ph .x{margin-left:auto}
.svs-tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line);margin:-4px 0 18px;overflow-x:auto;scrollbar-width:none}
.svs-tab{font:inherit;font-size:13px;font-weight:600;color:var(--slate);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.svs-tab:hover{color:var(--ink)}.svs-tab.on{color:var(--cobalt);border-bottom-color:var(--cobalt)}
.svs-db{margin-left:auto;font-size:11.5px;color:var(--slate);display:flex;align-items:center;gap:6px;white-space:nowrap;padding-left:12px}
.svs-db .dot{width:7px;height:7px;border-radius:50%;display:inline-block}.svs-db .dot.ok{background:var(--green)}.svs-db .dot.bad{background:var(--red)}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">R1</div><div><h1>ReconOne</h1><span>Marketplace Reconciliation</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><div class="run"><span class="dot"></span> Last run · Today 06:00 IST</div><div>Period: Jun 2026 · Nimbus Retail</div></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="ham" aria-label="Menu">☰</button>
      <div class="titles"><h2 id="pageTitle">Reconciliation Control Center</h2><p id="pageSub">Cross-module health across the reconciliation lifecycle</p></div>
      <div class="spacer"></div>
      <div class="filters" id="mktFilters"></div>
      <div class="pill">📅 Jun 2026</div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- drill-through drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><div><div class="dt" id="drTag">Exception</div><h3 id="drTitle">—</h3></div><button class="x" id="drClose">✕</button></div>
  <div class="db" id="drBody"></div>
  <div class="dactions" id="drActions"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const MKT={Amazon:{c:'#ff9900'},Flipkart:{c:'#2874f0'},Myntra:{c:'#ff3e6c'},Nykaa:{c:'#e5308a'},Ajio:{c:'#2f2f6d'}};
const fmtN=v=>v.toLocaleString('en-IN');
const swatch=m=>`<span class="swatch" style="background:${MKT[m].c}"></span>`;

function svg(i){return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${i}</svg>`}
const IC={
  grid:svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  coins:svg('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  box:svg('<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'),
  bank:svg('<path d="M3 10l9-6 9 6"/><path d="M4 10v9M20 10v9M8 10v9M16 10v9M12 10v9"/><path d="M2 21h20"/>'),
  shield:svg('<path d="M12 2l8 3v6c0 5-3.4 8.5-8 11-4.6-2.5-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/>'),
  ret:svg('<path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 7"/>'),
  recover:svg('<path d="M12 2v6l3-3M12 8L9 5"/><path d="M20 12a8 8 0 1 1-3.5-6.6"/><path d="M8 13l2.5 2.5L16 10"/>'),
  match:svg('<path d="M4 7h7M4 12h7M4 17h7"/><path d="M14 9l3 3-3 3"/><path d="M20 12h-6"/>'),
  bell:svg('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'),
  db:svg('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
  doc:svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>'),
  audit:svg('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'),
};

const MODULES=[
  {grp:'Overview',items:[{id:'home',name:'Control Center',icon:IC.grid}]},
  {grp:'Reconciliation Modules',items:[
    {id:'svs',name:'AR Reconciliations',icon:IC.bank,badge:'Live',badgeCls:'g'},
    {id:'revenue',name:'Revenue Reconciliations',icon:IC.coins},
    {id:'inventory',name:'Inventory Reconciliations',icon:IC.box},
    {id:'validation',name:'Commission & Cost Validations',icon:IC.shield},
    {id:'returns',name:'Product Return Tracking',icon:IC.ret},
  ]},
  {grp:'Operations & Governance',items:[
    {id:'matchq',name:'Match Queue',icon:IC.match,badge:34},
    {id:'alerts',name:'Alerts & Thresholds',icon:IC.bell,badge:6},
  ]},
];
const NAMES={};MODULES.forEach(g=>g.items.forEach(m=>NAMES[m.id]=m.name));

const MOD_SUMMARY=[
  {id:'revenue',label:'Revenue',icon:IC.coins,color:'#1E5EFF',metric:'93.4%',mlab:'Reconciled revenue',pct:93.4,health:['Healthy','var(--green)','var(--green-soft)'],open:12},
  {id:'inventory',label:'Inventory',icon:IC.box,color:'#0FA3A3',metric:'88.1%',mlab:'GRN match rate',pct:88.1,health:['Watch','var(--amber)','var(--amber-soft)'],open:8},
  {id:'svs',label:'AR',icon:IC.bank,color:'#7b61ff',metric:'91.2%',mlab:'Collection efficiency',pct:91.2,health:['Watch','var(--amber)','var(--amber-soft)'],open:15},
  {id:'validation',label:'Validations',icon:IC.shield,color:'#c47f04',metric:'₹9.2 L',mlab:'Financial leakage',pct:74,health:['Action','var(--red)','var(--red-soft)'],open:23},
  {id:'returns',label:'Returns',icon:IC.ret,color:'#cc3340',metric:'6.4%',mlab:'Return rate',pct:82,health:['Watch','var(--amber)','var(--amber-soft)'],open:9},
];

/* ============ NAV / TOPBAR ============ */
let active='home',charts=[];
const nav=document.getElementById('nav');
function buildNav(){
  nav.innerHTML=MODULES.map(g=>`<div class="nav-label">${g.grp}</div>`+g.items.map(navBtn).join('')).join('');
  nav.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function navBtn(m){const bd=m.badge?`<span class="badge ${m.badgeCls||''}">${m.badge}</span>`:'';return `<button class="nav-item ${m.id===active?'active':''}" data-id="${m.id}">${m.icon}<span>${m.name}</span>${bd}</button>`}

const mf=document.getElementById('mktFilters');
mf.innerHTML=`<span class="chip on" data-m="all">All brands</span>`+Object.keys(MKT).map(m=>`<span class="chip" data-m="${m}">${swatch(m)}${m}</span>`).join('');
mf.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{mf.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on')});

const SUBS={home:'Cross-module health across the reconciliation lifecycle',
  svs:'Upload → map columns → reconcile one or two months → review, carry forward and export',
  revenue:'Sales recorded in client systems vs marketplace & settlement records',
  inventory:'Inventory movement between platform logistics and client records',
  ar:'Settlement records vs actual collections received in bank accounts',
  validation:'Marketplace deductions vs contractual agreements & expected calculations',
  returns:'Full lifecycle of product returns from initiation to closure',
  recovery:'Turn identified leakage into raised claims and recovered cash',
  matchq:'Auto-matched, fuzzy and unmatched transactions awaiting review',
  alerts:'Threshold breaches and ageing exceptions needing attention',
  sources:'Ingestion health and freshness of every marketplace feed',
  ratecard:'Contracted commission, logistics and fee slabs per marketplace',
  audit:'Every change, with maker–checker approvals'};

function go(id){
  active=id;charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];buildNav();
  document.getElementById('pageTitle').textContent=id==='home'?'Reconciliation Control Center':NAMES[id];
  document.getElementById('pageSub').textContent=SUBS[id];
  document.getElementById('content').innerHTML=PAGES[id]();
  requestAnimationFrame(()=>{(CHARTS[id]||function(){})();wireTrackers();});
  window.scrollTo(0,0);document.getElementById('sidebar').classList.remove('open');closeDrawer();
}

/* ============ BUILDERS ============ */
function kpi(cls,lab,val,sub){return `<div class="kcard ${cls}"><div class="accent"></div><div class="lab">${lab}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`}
function sec(k,h){return `<div class="sec"><span class="k">${k}</span><h3>${h}</h3><div class="rule"></div></div>`}
function panel(t,h,b){return `<div class="panel"><div class="ph"><h4>${t}</h4>${h?`<span class="hint">${h}</span>`:''}</div><div class="pb">${b}</div></div>`}
function chartPanel(id,t,h,sm){return `<div class="panel"><div class="ph"><h4>${t}</h4>${h?`<span class="hint">${h}</span>`:''}</div><div class="pb"><div class="chart-wrap ${sm?'sm':''}"><canvas id="${id}"></canvas></div></div></div>`}
function tbl(cols,rows){return `<div class="panel"><div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}">${c.t}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`}
const TAGMAP={Open:'t-open','In Progress':'t-prog',Closed:'t-closed','Under Review':'t-review',Recovered:'t-closed',Disputed:'t-open',Pending:'t-prog','Claim Raised':'t-purple',Submitted:'t-review',Acknowledged:'t-prog',Credited:'t-closed','Written Off':'t-open','Approved':'t-closed','Pending Approval':'t-prog'};
function statusTag(s){return `<span class="tag ${TAGMAP[s]||'t-review'}">${s}</span>`}

/* exception tracker with checkboxes + bulk bar + drill-through */
let trackerSeq=0;
function tracker(cols,rows,module){
  const tid='trk'+(trackerSeq++);
  window.__trk=window.__trk||{};window.__trk[tid]={cols,rows,module};
  const head=`<th style="width:34px"><input type="checkbox" class="ck" data-all="${tid}"></th>`+cols.map(c=>`<th class="${c.r?'r':''}">${c.t}</th>`).join('');
  const body=rows.map((r,i)=>{
    const cells=cols.map((c,ci)=>{
      let v=r.cells[ci];
      return `<td class="${c.r?'r':''} ${c.cls&&c.cls(r.cells[ci])||''}">${v}</td>`;
    }).join('');
    return `<tr class="clickable" data-trk="${tid}" data-row="${i}"><td><input type="checkbox" class="ck" data-row-ck="${tid}" data-i="${i}" onclick="event.stopPropagation()"></td>${cells}</tr>`;
  }).join('');
  return `<div class="panel">
    <div class="bulkbar">
      <span class="selinfo" id="${tid}-info">0 selected</span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn sm pri" onclick="bulkAct('${tid}','Raise claim')">Raise claim</button>
      <button class="btn sm" onclick="bulkAct('${tid}','Assign owner')">Assign owner</button>
      <button class="btn sm" onclick="bulkAct('${tid}','Add note')">Add note</button>
      <button class="btn sm" onclick="bulkAct('${tid}','Export CSV')">⤓ Export CSV</button>
    </div>
    <div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  </div>`;
}
function wireTrackers(){
  document.querySelectorAll('[data-all]').forEach(a=>{
    a.onclick=()=>{const tid=a.dataset.all;document.querySelectorAll(`[data-row-ck="${tid}"]`).forEach(c=>c.checked=a.checked);updSel(tid)};
  });
  document.querySelectorAll('[data-row-ck]').forEach(c=>c.addEventListener('change',()=>updSel(c.dataset.rowCk)));
  document.querySelectorAll('tr[data-trk]').forEach(tr=>tr.onclick=()=>openException(tr.dataset.trk,+tr.dataset.row));
}
function updSel(tid){const n=[...document.querySelectorAll(`[data-row-ck="${tid}"]`)].filter(c=>c.checked).length;const el=document.getElementById(tid+'-info');if(el)el.textContent=n+' selected'}
function bulkAct(tid,act){const n=[...document.querySelectorAll(`[data-row-ck="${tid}"]`)].filter(c=>c.checked).length;toast(n?`${act} · ${n} exception${n>1?'s':''}`:`Select rows first — then: ${act}`)}

/* ============ DRAWER / DRILL-THROUGH ============ */
function openException(tid,i){
  const t=window.__trk[tid];const r=t.rows[i];const cols=t.cols;
  const kv=cols.map((c,ci)=>`<div class="kv"><span class="kk">${c.t}</span><span class="vv">${stripTag(r.cells[ci])}</span></div>`).join('');
  const body=`
    ${kv}
    <div class="dsec">Reconciliation trail</div>
    <div class="tl">
      ${(r.trail||defaultTrail).map(t=>`<div class="ti"><div class="tt">${t[0]}</div><div class="td">${t[1]}</div></div>`).join('')}
    </div>
    <div class="dsec">Root cause</div>
    <p style="font-size:12.5px;color:var(--slate);margin:0">${r.cause||'Variance flagged by the rules engine during the last reconciliation run. Recommended action: raise a claim with the marketplace and attach supporting settlement evidence.'}</p>`;
  showDrawer(t.module||'Exception', r.title||stripTag(r.cells[0]), body,[
    ['Raise claim','pri'],['Assign owner',''],['Add note',''],['Close exception','']
  ]);
}
const defaultTrail=[['Exception detected','Today 06:00 · auto-reconciliation run #4821'],['Matched against settlement file','Confidence 61% — below auto-match threshold'],['Queued for review','Assigned to module owner']];
function showDrawer(tag,title,body,actions){
  document.getElementById('drTag').textContent=tag;
  document.getElementById('drTitle').textContent=title;
  document.getElementById('drBody').innerHTML=body;
  document.getElementById('drActions').innerHTML=actions.map(a=>`<button class="btn ${a[1]}" onclick="toast('${a[0]} · demo action');">${a[0]}</button>`).join('');
  document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('show');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('show')}
function stripTag(s){return String(s).replace(/<[^>]+>/g,'').trim()}
document.getElementById('drClose').onclick=closeDrawer;document.getElementById('scrim').onclick=closeDrawer;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* Control Center: replace the AR tile's placeholder stats with the latest live run.
   Silently keeps the static values if the backend is unreachable or no run exists yet. */
async function patchArTile(){
  const card=document.querySelector('.modcard[data-modcard="svs"]');
  if(!card)return;
  let runs;try{runs=await api('/api/runs')}catch(e){return}
  const done=(runs||[]).filter(r=>r.status==='DONE');
  if(!done.length)return;
  const r=done[0];
  const comp=(r.matched||0)+(r.unmatched||0);
  const rate=comp?Math.round(1000*r.matched/comp)/10:0;
  const h=rate>=95?['Healthy','var(--green)','var(--green-soft)']:rate>=85?['Watch','var(--amber)','var(--amber-soft)']:['Action','var(--red)','var(--red-soft)'];
  const hb=card.querySelector('.health');if(hb){hb.textContent=h[0];hb.style.background=h[2];hb.style.color=h[1];}
  const met=card.querySelector('.metric');if(met)met.textContent=rate+'%';
  const ml=met&&met.nextElementSibling;if(ml)ml.textContent='Match rate'+(r.period?' · '+r.period:'');
  const bar=card.querySelector('.bar i');if(bar)bar.style.width=rate+'%';
  const mls=card.querySelectorAll('.mlab');const open=mls[mls.length-1];
  if(open)open.textContent=num(r.exception_count||0)+' open exceptions';
}

const API_BASE=(location.protocol==='file:')?'http://127.0.0.1:8000':'';
const SVS={tab:'dashboard',run:null,status:'',exc:'',q:'',page:1,size:50,summary:null,setup:null,oi:{platform:'',show:'open'},dcPeriod:'',busy:false};
const SVS_TABS=[['dashboard','Dashboard'],['results','Results'],['upload','Upload data'],['run','Run reconciliation'],['open','Open items']];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=v=>{if(v==null||v==='')return '–';const n=Number(v);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
const inrS=v=>{if(v==null)return '–';const a=Math.abs(v),s=v<0?'-':'';return a>=1e7?s+'₹'+(a/1e7).toFixed(2)+' Cr':a>=1e5?s+'₹'+(a/1e5).toFixed(2)+' L':s+'₹'+a.toLocaleString('en-IN',{maximumFractionDigits:0})};
const num=v=>v==null?'–':Number(v).toLocaleString('en-IN');
const wrapL=(t,w=22)=>{const out=[];let cur='';String(t).split(' ').forEach(x=>{if((cur+' '+x).trim().length>w){out.push(cur.trim());cur=x}else cur+=' '+x});if(cur.trim())out.push(cur.trim());return out};
const monthL=d=>{if(!d)return '';const s=String(d).slice(0,7);const [y,m]=s.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'})};
const dateL=d=>d?new Date(String(d).length<=10?d+'T00:00:00':d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'–';
const dtL=d=>d?new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'–';
const nextMonth=v=>{const [y,m]=v.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

async function api(path,opt){
  let r;try{r=await fetch(API_BASE+path,opt)}catch(e){throw new Error('Cannot reach the ReconOne backend. Start it with "python server.py" and open http://127.0.0.1:8000')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error)||(r.status+' '+r.statusText));e.data=j;throw e}
  return j;
}
const dl=p=>API_BASE+p;

async function svsDashboard(el){
  let runs;try{runs=await api('/api/runs')}catch(e){return svsError(el,e)}
  const done=runs.filter(r=>r.status==='DONE');
  if(!done.length){el.innerHTML=`<div class="panel"><div class="pb svs-empty"><b>No reconciliation yet.</b><br>1. <a href="#" data-go="upload">Upload</a> the five files for each data month &nbsp;→&nbsp; 2. <a href="#" data-go="run">Run the reconciliation</a> &nbsp;→&nbsp; 3. Review it here.</div></div>`;el.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();svsTab(a.dataset.go)});return}
  if(!SVS.run||!done.some(r=>r.run_id===SVS.run))SVS.run=done[0].run_id;
  svsUpdateChrome(done[0]);
  el.innerHTML=`
    <div class="panel svs-bar"><div class="pb svs-row">
      <label class="svs-f">Run <select id="svsRun">${done.map(r=>`<option value="${r.run_id}" ${r.run_id===SVS.run?'selected':''}>#${r.run_id} · ${esc(r.period)} · ${esc(r.platform||'All platforms')}</option>`).join('')}</select></label>
      <div style="flex:1"></div>
      <a class="btn pri" id="svsXl" href="#">Download Excel</a>
    </div></div>
    <div id="svsBody"><div class="svs-empty">Loading…</div></div>`;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>svsTab(b.dataset.go));
  const sel=document.getElementById('svsRun');
  sel.onchange=()=>{SVS.run=+sel.value;SVS.kv=null;SVS.status='';SVS.exc='';SVS.q='';SVS.page=1;svsRender()};
  if(SVS.tab==='results')SVS.kv=null;
  svsRender();
}

const SVS_NOT_MATCHED='_NOT_MATCHED',SVS_ANY_EXC='_ANY_EXCEPTION';

// horizontal status filter: All · Not matched · each status (with counts)
function svsChips(s,cur,attr){

  const items=[['','All',s.kpi.total_keys,''],[SVS_NOT_MATCHED,'Not matched',notM,'']].concat(s.statuses.map(x=>[x.code,x.label,x.n,x.color]));
  return `<div class="svs-chips" role="tablist">${items.map(([c,l,n,col])=>`<button class="chip ${cur===c?'on':''}" ${attr}="${esc(c)}" role="tab" aria-selected="${cur===c}">${col?`<span class="svs-dot" style="background:${col}"></span>`:''}${esc(l)} <b>${num(n)}</b></button>`).join('')}</div>`;
}
function svsKpiSync(){

const SVS_FEE_TILES={

  LOGISTICS_ABOVE_ALLOWED:['warn',r=>'Logistics above '+(r.logistics_pct!=null?r.logistics_pct+'% of MRP':'allowed %'),'excess logistics (fwd + rev)'],
  CLAIM_RECOVERABLE:['purp',()=>'Recoverable from marketplace','to claim back'],
  SETTLEMENT_SHORT_PAID:['bad',()=>'Settlement short paid','short vs re-calculated settlement'],
  SETTLEMENT_EXCESS_PAID:['tealc',()=>'Settlement excess paid','excess vs re-calculated settlement']
};
function svsFeesHTML(s){
  const fees=s.fees||[];if(!fees.length)return '';
  const tiles=fees.filter(f=>SVS_FEE_TILES[f.code]).map(f=>{
    const [cls,lab,what]=SVS_FEE_TILES[f.code],title=lab(s.run);
    if(f.status==='NOT RUN')return kpi('info',esc(title),'Not run',esc(f.note||'Check skipped'));
    SVS_KPI['fee_'+f.code]={fee:f.code,title:title};
    return svsKpi('fee_'+f.code,f.n?cls:'good',esc(title),num(f.keys)+' orders',inrS(f.amount)+' '+what+' · '+num(f.n)+' rows');
  }).join('');
  return `${sec('Fee checks','Settlement files')}
    <div class="kpis c4">${tiles}</div>`;
}

async function svsRender(){
  const body=document.getElementById('svsBody');if(!body)return;
  body.innerHTML='<div class="svs-empty">Loading…</div>';
  charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];
  let s,trend;
  try{[s,trend]=await Promise.all([api('/api/summary/'+SVS.run),api('/api/status-trend')])}catch(e){return svsError(body,e)}
  SVS.summary=s;
  document.getElementById('svsXl').href=dl('/api/download/'+SVS.run);
  body.innerHTML=svsBodyHTML(s);
  if(window.Chart){
    mk('svsStatus',{type:'bar',data:{labels:s.statuses.map(x=>wrapL(x.label)),datasets:[{data:s.statuses.map(x=>x.n),backgroundColor:s.statuses.map(x=>x.color),borderRadius:5,barThickness:18}]},
      options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>s.statuses[c[0].dataIndex].label}}},scales:{x:{...AX,ticks:{precision:0}},y:{...NOG,ticks:{autoSkip:false,font:{size:11}}}},onClick:(e,el)=>{if(el.length)svsFilter('status',s.statuses[el[0].index].code)}}});
    mk('svsTrend',{type:'line',data:{labels:trend.map(t=>t.label),datasets:[{label:'Match rate',data:trend.map(t=>t.match_rate),borderColor:'#1E5EFF',backgroundColor:'rgba(30,94,255,.08)',fill:true,tension:.35,pointRadius:3,borderWidth:2}]},options:lineopt(0,100,'%')});
  }
  if(SVS.tab!=='results'){
    body.querySelectorAll('[data-svs-kpi]').forEach(c=>{
      const go=()=>svsKvToggle(c.dataset.svsKpi);
      c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
    });
    if(SVS.kv)svsKv();
    return;
  }
  document.getElementById('svsExcSel').onchange=e=>{SVS.exc=e.target.value;SVS.page=1;svsRows()};
  document.getElementById('svsStSel').onchange=e=>{SVS.status=e.target.value;SVS.page=1;svsRows()};
  document.getElementById('svsClr').onclick=()=>{SVS.status='';SVS.exc='';SVS.q='';SVS.page=1;document.getElementById('svsQ').value='';svsRows()};
  const q=document.getElementById('svsQ');
  q.value=SVS.q;
  q.oninput=()=>{clearTimeout(window.__svsq);window.__svsq=setTimeout(()=>{SVS.q=q.value.trim();SVS.page=1;svsRows()},300)};
  svsRows();
}
function svsFilter(kind,code){

  svsRows();

}

      ${d.datasets.map(x=>`<tr><td><b>${esc(x.label)}</b></td>${periods.map(p=>{const n=x.periods[p];const pr=(d.profiles[p]||{})[x.name];const fl=pr&&pr.flags.length?`<span class="svs-flag ${pr.flags.some(f=>f.level==='bad')?'bad':''}" title="${esc(pr.flags.map(f=>f.message).join('\n'))}">!</span>`:'';

    </tbody></table></div></div>`:`<div class="panel"><div class="pb svs-empty">Nothing loaded yet.</div></div>`}`;
  el.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();svsTab(a.dataset.go)});
  const f=document.getElementById('svsUp'),fi=f.querySelector('input[type=file]');
  fi.onchange=()=>{document.getElementById('svsFileName').textContent=fi.files[0]?fi.files[0].name:'Choose or drop a file';
    const n=(fi.files[0]&&fi.files[0].name.toLowerCase())||'';const guess=[['reverse','settlement_reverse'],['settle','settlement_forward'],['rto','sales_rto'],['rt','sales_rt'],['sale','sales_forward']].find(([k])=>n.includes(k));
    if(guess&&!f.dataset.touched)f.dataset.value=guess[1],f.elements.dataset.value=guess[1]};
  f.elements.dataset.onchange=()=>f.dataset.touched='1';
  f.onsubmit=async e=>{
    e.preventDefault();const btn=document.getElementById('svsUpBtn'),msg=document.getElementById('svsUpMsg');
    btn.disabled=true;btn.textContent='Uploading…';msg.innerHTML='<div class="svs-note">Reading and loading the file — large files can take a minute.</div>';

      msg.innerHTML=`<div class="svs-note ok"><b>${esc(r.label)} · ${esc(monthL(r.period))}:</b> loaded ${num(r.rows_loaded)} rows from ${esc(r.file)} (${r.mode==='replace'?'replaced that month':'appended'}).

  };
  el.querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';const t=b.textContent;b.textContent=b.dataset.period?'Clear?':'Confirm clear all';b.classList.add('warn');setTimeout(()=>{b.dataset.armed='';b.textContent=t;b.classList.remove('warn')},3000);return}
    try{await api(`/api/data/${b.dataset.clear}?period=${encodeURIComponent(b.dataset.period)}`,{method:'DELETE'});toast('Cleared');svsUpload(el)}catch(e){toast(e.message)}
  });
}

/* ---------- RUN ---------- */
// one column dropdown: field name (+ help) on the left, the file's column on the right
function svsMapSel(d,f,label){
  return `<label class="svs-mrow" data-row-ds="${d.name}" data-row-role="${f.role}">
    <span class="svs-mlab">${esc(label||f.label)}${f.required?' <b class="req" title="Required">*</b>':''}</span>
    <select data-ds="${d.name}" data-role="${f.role}" ${f.required?'data-req="1"':''}><option value="">${f.required?'— choose a column —':'— not used —'}</option>${d.columns.map(c=>`<option value="${esc(c.value)}" ${c.value===f.selected?'selected':''}>${esc(c.header)}</option>`).join('')}</select></label>`;
}
const SVS_STEP=(n,title)=>`<div class="svs-step"><span class="svs-stepn">${n}</span><div><h3>${title}</h3></div></div>`;
// what each fee-check card does, in plain words
const SVS_FEE_INFO={
  commission:'Flags commission above your allowed % of net sales, and re-does the file’s commission, TCS and TDS maths.',
  logistics:'Flags forward + reverse logistics above your allowed % of MRP, and checks the fees and GST add up.',
  settlement:'Re-calculates what the marketplace should have paid, compares it with what it paid, and works out the claim.',
  payment:'Checks prepaid + postpaid payments add up to the settlement and that every payment has a bank UTR.'
};
function svsNum(name,label,val,help,opt={}){
  return `<label class="svs-in"><span>${label}</span><div class="svs-inw">${opt.pre?`<i>${opt.pre}</i>`:''}<input type="number" name="${name}" value="${esc(val)}" step="${opt.step||'0.01'}" ${opt.min!=null?`min="${opt.min}"`:''} ${opt.max!=null?`max="${opt.max}"`:''} ${opt.ph?`placeholder="${esc(opt.ph)}"`:''}>${opt.suf?`<i>${opt.suf}</i>`:''}</div></label>`;
}
// step 3: one card per check group — its limits / rates up front, the columns it reads folded away
function svsFeeSetup(st){
  const df=st.defaults,ds=st.sides.flatMap(s=>s.datasets).filter(d=>d.name.startsWith('settlement'));
  const pct={min:0,max:100,suf:'%'};
  const filters={
    commission:svsNum('commission_pct','Allowed commission',df.commission_pct,'Of net sales (customer paid). Blank = no limit check.',{...pct,ph:'e.g. 8.26'})
      +svsNum('tcs_rate','TCS rate',df.tcs_rate,'Of taxable amount',pct)+svsNum('tds_rate','TDS rate',df.tds_rate,'Of taxable amount',pct),
    logistics:svsNum('logistics_pct','Allowed logistics',df.logistics_pct,'Of MRP, forward + reverse. Blank = no limit check.',pct)
      +svsNum('logistics_gst_rate','GST on logistics',df.logistics_gst_rate,'Of the logistics fees',pct)+svsNum('pg_rate','Payment gateway fee',df.pg_rate,'Of customer paid',pct),
    settlement:svsNum('commission_tol','Allowed difference',df.commission_tol,'Smaller gaps are ignored (rounding). Also used for tax and fee checks.',{pre:'₹',min:0}),
    payment:''
  };
  const fileName={settlement_forward:'Forward settlement file',settlement_reverse:'Reverse settlement file'};
  const cards=(st.fee_groups||[]).map(g=>{
    const per=ds.filter(d=>d.rows).map(d=>[d,d.fields.filter(f=>f.group===g.code)]).filter(([,fs])=>fs.length);
    const n=per.reduce((a,[,fs])=>a+fs.length,0);
    const cols=per.length?per.map(([d,fs])=>`<div class="svs-mfile">${esc(fileName[d.name])}</div>${fs.map(f=>svsMapSel(d,f)).join('')}`).join('')
      :'<div class="svs-meta">No settlement file uploaded.</div>';
    return `<div class="panel svs-chk" data-grp="${g.code}">
      <div class="svs-chk-h"><h4>${esc(g.label)}</h4><span class="svs-badge" data-badge="${g.code}"></span></div>
      ${filters[g.code]?`<div class="svs-ins">${filters[g.code]}</div>`:''}
      <details class="svs-cols"><summary>Columns <span class="svs-meta" data-cnt="${g.code}">(${n})</span></summary><div class="svs-mgrid">${cols}</div></details>
    </div>`;
  }).join('');
  return `${SVS_STEP(2,'Fee &amp; settlement checks')}
    <div class="svs-chks">${cards}</div>`;
}
// step 4: one folding block per file; opens by itself when a required column is missing
function svsMapSetup(st){
  return `${SVS_STEP(3,'File columns')}
    <div class="svs-files">${st.sides.flatMap(s=>s.datasets).map(d=>{
      const fs=d.fields.filter(f=>!f.group);
      return `<details class="panel svs-fileblk" data-file="${d.name}">
        <summary><span class="svs-fname">${esc(d.label)}</span><span class="svs-meta">${d.rows?num(d.rows)+' rows':'not uploaded'}</span><span class="svs-badge" data-fbadge="${d.name}"></span></summary>
        <div class="svs-mgrid">${d.rows?fs.map(f=>svsMapSel(d,f)).join(''):'<div class="svs-meta">Not uploaded.</div>'}</div>
      </details>`}).join('')}</div>`;
}
// badges + the summary bar, recomputed on every change
function svsRunRefresh(){
  const f=document.getElementById('svsRunF');if(!f)return;
  const sel=(q)=>[...f.querySelectorAll(q)];
  const val=n=>(f.elements[n]&&f.elements[n].value||'').trim();
  let reqMissing=0;
  document.querySelectorAll('[data-file]').forEach(b=>{
    const ss=sel(`.svs-fileblk[data-file="${b.dataset.file}"] select[data-ds]`),miss=ss.filter(s=>s.dataset.req&&!s.value),unused=ss.filter(s=>!s.dataset.req&&!s.value);
    reqMissing+=miss.length;
    const bd=b.querySelector('[data-fbadge]');
    bd.className='svs-badge '+(!ss.length?'off':miss.length?'bad':unused.length?'warn':'ok');
    bd.textContent=!ss.length?'No data':miss.length?miss.length+' required missing':unused.length?ss.length-unused.length+' of '+ss.length+' matched':'All matched';
    if(miss.length)b.open=true;
  });
  let groupsOn=0;
  (SVS.setup.fee_groups||[]).forEach(g=>{
    const ss=sel(`.svs-chk[data-grp="${g.code}"] select[data-ds]`),used=ss.filter(s=>s.value).length;
    const limit=g.code==='commission'?val('commission_pct'):g.code==='logistics'?val('logistics_pct'):null;
    const bd=document.querySelector(`[data-badge="${g.code}"]`);
    const cnt=document.querySelector(`[data-cnt="${g.code}"]`);if(cnt)cnt.textContent=`(${used} of ${ss.length} found)`;
    let cls='ok',t='Ready';
    if(!ss.length){cls='off';t='No data'}
    else if(!used){cls='off';t='Skipped'}
    else{groupsOn++;
      if(limit===''){cls='warn';t='No limit'}
      else if(limit!=null){t='Limit '+limit+'%'}
      if(used<ss.length&&cls==='ok'){cls='warn';t+=' · '+(ss.length-used)+' not used'}}
    bd.className='svs-badge '+cls;bd.textContent=t;
  });
  const m=val('month'),mt=val('month_to'),pl=val('platform');
  const bar=document.getElementById('svsRunSum');
  if(bar)bar.innerHTML=[
    `<b>${m?esc(monthL(m))+(mt&&mt!==m?' – '+esc(monthL(mt)):''):'No month chosen'}</b>`,
    esc(pl||'All platforms'),
    `${groupsOn} of ${(SVS.setup.fee_groups||[]).length} checks on`,
    reqMissing?`<span class="bad">${reqMissing} required column${reqMissing>1?'s':''} missing</span>`:'<span class="ok">Ready</span>'
  ].join('<span class="svs-sep">·</span>');
}
async function svsRunTab(el){
  let st;try{st=await api('/api/run/setup')}catch(e){return svsError(el,e)}
  SVS.setup=st;const df=st.defaults;
  const hasData=st.sides.some(s=>s.datasets.some(d=>d.rows>0));
  el.innerHTML=`
    ${!hasData?`<div class="svs-note warn">No data uploaded.</div>`:''}
    <form id="svsRunF" class="svs-runf">
    ${SVS_STEP(1,'Filters')}
    <div class="panel"><div class="pb svs-ins svs-ins-wide">
      <label class="svs-in"><span>From month</span><input type="month" name="month" id="svsMf" value="${esc(df.month)}" required></label>
      <label class="svs-in"><span>To month</span><input type="month" name="month_to" id="svsMt" value=""></label>
      <label class="svs-in"><span>Platform</span><select name="platform" id="svsPlat"><option value="">All platforms</option>${st.platforms.map(p=>`<option>${esc(p)}</option>`).join('')}</select></label>
      ${svsNum('tolerance','Amount tolerance',df.tolerance,'',{pre:'₹',step:'0.001',min:0})}
      ${svsNum('return_window','Return window',df.return_window,'',{suf:'days',step:'1',min:0})}
    </div></div>
    ${svsFeeSetup(st)}
    ${svsMapSetup(st)}
    <div class="svs-runbar"><div class="svs-runsum"><div id="svsRunSum"></div><div id="svsRunMsg"></div></div><button class="btn pri lg" type="submit" id="svsRunBtn">Run reconciliation</button></div>
    </form>`;
  el.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();svsTab(a.dataset.go)});
  const mf=document.getElementById('svsMf'),mt=document.getElementById('svsMt');
  const sync=()=>{if(!mf.value)return;mt.min=mf.value;mt.max=nextMonth(mf.value);if(mt.value&&(mt.value<mt.min||mt.value>mt.max))mt.value=''};
  mf.onchange=()=>{sync();svsRunRefresh()};sync();
  const platSel=el.querySelector('select[data-ds=settlement_forward][data-role=platform]');
  if(platSel)platSel.addEventListener('change',async()=>{const ps=document.getElementById('svsPlat');const cur=ps.value;
    const vals=platSel.value?await api(`/api/values/settlement_forward?column=${encodeURIComponent(platSel.value)}`).catch(()=>[]):[];
    ps.innerHTML='<option value="">All platforms</option>'+vals.map(p=>`<option ${p===cur?'selected':''}>${esc(p)}</option>`).join('');svsRunRefresh()});
  const form=document.getElementById('svsRunF');
  form.addEventListener('input',svsRunRefresh);form.addEventListener('change',svsRunRefresh);
  svsRunRefresh();
  form.onsubmit=async e=>{
    e.preventDefault();const f=e.target,msg=document.getElementById('svsRunMsg'),btn=document.getElementById('svsRunBtn');
    const missing=[...f.querySelectorAll('select[data-req]')].filter(s=>!s.value);
    if(missing.length){
      msg.innerHTML=`<div class="svs-note bad">Choose a column for: ${missing.map(s=>esc(DS_LABEL[s.dataset.ds]+' → '+s.closest('label').querySelector('.svs-mlab').firstChild.textContent.trim())).join(', ')}</div>`;
      const blk=missing[0].closest('details');if(blk)blk.open=true;missing[0].scrollIntoView({behavior:'smooth',block:'center'});missing[0].focus({preventScroll:true});return}
    const mapping={};f.querySelectorAll('select[data-ds]').forEach(s=>{(mapping[s.dataset.ds]=mapping[s.dataset.ds]||{})[s.dataset.role]=s.value});
    const body={month:f.month.value,month_to:f.month_to.value,tolerance:f.tolerance.value,return_window:f.return_window.value,commission_tol:f.commission_tol.value,commission_pct:f.commission_pct.value,logistics_pct:f.logistics_pct.value,logistics_gst_rate:f.logistics_gst_rate.value,tcs_rate:f.tcs_rate.value,tds_rate:f.tds_rate.value,pg_rate:f.pg_rate.value,platform:f.platform.value,mapping};
    btn.disabled=true;btn.textContent='Running…';msg.innerHTML=`<div class="svs-note"><span class="svs-spin"></span> Running…</div>`;
    try{const r=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      toast('Run #'+r.run_id+' completed — results on the Dashboard');SVS.run=r.run_id;SVS.status='';SVS.exc='';SVS.q='';SVS.page=1;svsTab('dashboard')}
    catch(err){const list=err.data&&err.data.errors;msg.innerHTML=`<div class="svs-note bad">${esc(err.message)}${list?'<ul>'+list.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}</div>`;btn.disabled=false;btn.textContent='Run reconciliation'}
  };
}

async function svsOpenItems(el){
  const p=new URLSearchParams({platform:SVS.oi.platform,show:SVS.oi.show});
  let d;try{d=await api('/api/open-items?'+p)}catch(e){return svsError(el,e)}
  const tot=d.buckets.reduce((a,b)=>a+b.n,0),amt=d.buckets.reduce((a,b)=>a+b.diff,0);
  el.innerHTML=`
    ${sec('Carry-forward','Keys not matched in a run stay open and are re-checked in every following run until they match')}
    <div class="panel svs-bar"><div class="pb svs-row">
      <label class="svs-f">Show <select id="oiShow"><option value="open">Still open</option><option value="closed">Closed by a later run</option></select></label>
      <label class="svs-f">Platform <select id="oiPlat">${d.platforms.map(x=>`<option value="${esc(x)}">${esc(x||'All platforms')}</option>`).join('')||'<option value="">All platforms</option>'}</select></label>
      <div style="flex:1"></div><span class="selinfo">${num(d.total)} items</span>

    </div></div>
    ${SVS.oi.show==='open'?`<div class="kpis c4">${kpi('warn','Open items',num(tot),inrS(amt)+' open difference')}${d.buckets.slice(0,3).map(b=>kpi(b.bucket.startsWith('Awaiting')?'good':b.bucket==='90+ days'?'bad':'info',esc(b.bucket),num(b.n),inrS(b.diff))).join('')}</div>`:''}
    <div class="panel" style="margin-top:14px"><div class="tbl-wrap"><table><thead><tr><th>Key</th><th>Status</th><th>Open since</th><th>Sale date</th><th class="r">Age</th><th class="r">Net sales</th><th class="r">Net settlement</th><th class="r">Difference</th><th>Last checked</th>${SVS.oi.show==='closed'?'<th>Closed in</th>':''}</tr></thead><tbody>
      ${d.rows.length?d.rows.map(r=>`<tr><td class="mono">${esc(r.item_key)}</td><td><span class="tag" style="background:${r.status_color}1a;color:${r.status_color}">${esc(r.status_label)}</span>${r.awaiting_settlement?' <span class="tag t-closed">awaiting T+'+d.lag_days+'</span>':''}</td>
        <td>${esc(monthL(r.first_month))}</td><td>${esc(r.sale_date?dateL(r.sale_date):'–')}</td><td class="r">${num(r.age_days)} d</td><td class="r">${inr(r.net_sales)}</td><td class="r">${inr(r.net_settlement)}</td><td class="r ${r.difference<0?'neg':''}">${inr(r.difference)}</td>
        <td>${esc(monthL(r.last_month))} <span class="svs-meta">#${esc(r.last_run_id)}</span></td>${SVS.oi.show==='closed'?`<td>${esc(monthL(r.closed_month))} <span class="svs-meta">#${esc(r.closed_run_id)}</span></td>`:''}</tr>`).join('')
        :`<tr><td colspan="10" class="svs-empty">No ${SVS.oi.show} items</td></tr>`}
    </tbody></table></div>${d.total>d.rows.length?`<div class="svs-pager">Showing ${num(d.rows.length)} of ${num(d.total)} — download Excel for all</div>`:''}</div>`;
  const s=document.getElementById('oiShow'),pl=document.getElementById('oiPlat');s.value=SVS.oi.show;pl.value=SVS.oi.platform;
  s.onchange=()=>{SVS.oi.show=s.value;svsOpenItems(el)};pl.onchange=()=>{SVS.oi.platform=pl.value;svsOpenItems(el)};

/* ---------- DATA CHECK ---------- */
async function svsDataCheck(el){
  let d;try{d=await api('/api/data-check'+(SVS.dcPeriod?'?period='+encodeURIComponent(SVS.dcPeriod):''))}catch(e){return svsError(el,e)}
  if(!d.periods.length){el.innerHTML='<div class="panel"><div class="pb svs-empty">Nothing uploaded with a data month yet.</div></div>';return}
  SVS.dcPeriod=d.period;
  const [m0,m1]=d.month;
  el.innerHTML=`
    ${sec('Data check','Dates and amounts of every file per data month — catch a wrong or partial upload before running')}
    <div class="panel svs-bar"><div class="pb svs-row">
      <label class="svs-f">Data month <select id="dcP">${d.periods.map(p=>`<option value="${esc(p)}" ${p===d.period?'selected':''}>${esc(monthL(p))}</option>`).join('')}</select></label>
      <div style="flex:1"></div><button class="btn" id="dcRef">Recompute with current mapping</button>
    </div></div>
    ${d.cross_checks.length?d.cross_checks.map(c=>`<div class="svs-note">${esc(c)}</div>`).join(''):''}
    <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>File</th><th class="r">Rows</th><th>Date column</th><th>First date</th><th>Last date</th><th class="r">Before</th><th class="r">In month</th><th class="r">After</th><th class="r">Total amount</th><th>Check</th></tr></thead><tbody>
      ${d.datasets.map(x=>{const p=x.profile;return p?`<tr><td><b>${esc(x.label)}</b></td><td class="r">${num(p.rows)}</td><td class="mono">${esc(p.date_column||'–')}</td><td>${esc(dateL(p.min_date))}</td><td>${esc(dateL(p.max_date))}</td><td class="r">${num(p.before_month)}</td><td class="r">${num(p.in_month)}</td><td class="r">${num(p.after_month)}</td><td class="r">${inr(p.total_amount)}</td>
        <td>${p.flags.length?p.flags.map(f=>`<div class="svs-flagline ${f.level}">${esc(f.message)}</div>`).join(''):'<span class="tag t-closed">OK</span>'}</td></tr>`:`<tr><td><b>${esc(x.label)}</b></td><td colspan="9" class="svs-meta">Not loaded for this month</td></tr>`}).join('')}
    </tbody></table></div></div>
    ${sec('Per day','Rows per day — red = a day of the month with no rows, grey = outside the data month')}
    <div class="panel"><div class="pb svs-heat-wrap"><table class="svs-heat"><thead><tr><th></th>${d.days.map(day=>`<th title="${esc(day)}">${+day.slice(8)}</th>`).join('')}</tr></thead><tbody>
      ${d.datasets.filter(x=>x.profile).map(x=>{const pd=x.profile.per_day||{};const mx=Math.max(1,...Object.values(pd));return `<tr><th>${esc(x.label)}</th>${d.days.map(day=>{const n=pd[day]||0,inm=day>=m0&&day<=m1;
        const bg=!inm?(n?'#dfe3ea':'#f3f4f7'):n?`rgba(30,94,255,${(.15+.85*n/mx).toFixed(2)})`:'#fbe7e8';return `<td style="background:${bg}" title="${esc(day)}: ${n} rows"></td>`}).join('')}</tr>`}).join('')}
    </tbody></table></div></div>`;
  document.getElementById('dcP').onchange=e=>{SVS.dcPeriod=e.target.value;svsDataCheck(el)};
  document.getElementById('dcRef').onclick=async e=>{e.target.disabled=true;e.target.textContent='Recomputing…';try{await api('/api/data-check/refresh',{method:'POST'});toast('Data check recomputed')}catch(x){toast(x.message)}svsDataCheck(el)};
}
